<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erreur 404 | NAYBEL - Photographie</title>
    
    <!-- Tailwind CSS pour conserver la même cohérence -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://kit.fontawesome.com/8074b1cd85.js" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#242322',      /* Brun Charbon */
                        sienna: '#a1674a',    /* Sienne Brûlée */
                        ivory: '#efeae5',     /* Ivoire Doux */
                    },
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                    },
                    letterSpacing: {
                        widest: '.25em',
                        ultra: '.35em',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-dark text-ivory font-sans antialiased h-screen flex items-center justify-center px-6 overflow-hidden">

    <div class="max-w-xl w-full text-center">
        <!-- Logo / Monogramme optionnel -->
        <div class="mb-6 flex justify-center">
            <a href="https://naybel.fr/" class="text-3xl font-light tracking-widest text-ivory hover:text-sienna transition-colors">
                <svg class="h-12 w-auto fill-current">
                    <use href="app/assets/logo.svg#mon-logo"></use>
                </svg>
            </a>
        </div>

        <!-- Code 404 stylisé aux couleurs sienne/ivoire -->
        <h1 class="text-8xl md:text-9xl font-light tracking-widest text-sienna mb-2">404</h1>
        <div class="w-16 h-px bg-sienna mx-auto mb-6"></div>
        
        <h2 class="text-xl md:text-2xl font-light tracking-wide uppercase mb-4">Page introuvable</h2>
        
        <p class="text-ivory/70 font-light text-sm md:text-base leading-relaxed mb-8">
            Il semble que vous soyez hors cadre. L'instant ou la page que vous recherchez n'existe pas ou a été déplacée.
        </p>

        <!-- Bouton de retour élégant aligné sur la charte -->
        <div>
            <a href="https://naybel.fr/" class="inline-block border border-ivory/30 px-10 py-4 text-xs uppercase tracking-widest text-ivory hover:bg-sienna hover:border-sienna transition-all duration-300">
                Retour à l'accueil
            </a>
        </div>

        <!-- Note technique discrète -->
        <div class="mt-12 text-[10px] uppercase tracking-[0.3em] text-ivory/40">
            NAYBEL &bull; Studio Photographie
        </div>
    </div>

</body>
</html>
